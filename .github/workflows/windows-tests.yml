name: Windows PowerShell tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows PowerShell 5.1
            shell: powershell
          - label: PowerShell 7
            shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: ${{ matrix.shell }}
        run: |
          $errors = @()
          Get-ChildItem scenarios, tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors)
            $errors += @($fileErrors | Where-Object { $null -ne $_ })
          }
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parse failed.' }
      - name: Smoke tests
        shell: ${{ matrix.shell }}
        run: ./tests/smoke.ps1
      - name: Hardening tests
        shell: ${{ matrix.shell }}
        run: ./tests/hardening.ps1
      - name: Recovery planning tests
        shell: ${{ matrix.shell }}
        run: ./tests/recovery.ps1
