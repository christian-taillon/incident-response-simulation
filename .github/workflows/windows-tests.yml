name: Windows PowerShell tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows PowerShell 5.1
            executable: powershell
          - label: PowerShell 7
            executable: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Offline checks
        shell: pwsh
        run: |
          $check = @'
          $ErrorActionPreference = 'Stop'
          $errors = @()
          Get-ChildItem scenarios, tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors)
            $errors += @($fileErrors | Where-Object { $null -ne $_ })
          }
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parse failed.' }
          & ./tests/smoke.ps1
          & ./tests/hardening.ps1
          & ./tests/recovery.ps1
          '@
          & '${{ matrix.executable }}' -NoProfile -NonInteractive -Command $check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
